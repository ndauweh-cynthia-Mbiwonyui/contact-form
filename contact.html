<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact section</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="container" >
        <div style="text-align: center;">
            <h2>
                Contact Us
            </h2>
            <p>
                swing by for some rice, or 
                leave us a message: 
                
            </p>
            <div class="row">
                <div class="column">
                    <img src="cynthia.png" style="width: 100%;">
                </div>
                <div class="column">
                    <form action="#">
                        <label for="fname">First Name</label>
                        <input type="text"  name="fname" id="fname" placeholder="Your name is...."> 
                        <label for="lname">Last Name</label>
                        <input type="text" name="lname" id="lname"
                        placeholder="Your last name is....">
                        <label for="counttry">country</label>
                        <select name="country" id="country">
                            <option value="america">America</option>
                            <option value="austria">Austria</option>
                            <option value="canada">Canada</option>
                            <option value="cameroon">Cameroon</option>
                        </select>
                        <label for="subject">Subject</label>
                        <textarea name="subject" id="subject" 
                        placeholder="Write something .... " style="height: 170px;"></textarea>
                        <input type="Submit" value="Submit">

                    </form>
            </div>
        </div>
    </div>
</body>
</html>
